<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GachiWork — Interactive Prototype</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#2E74B5">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2E74B5"/>
          <stop offset="0.5" stop-color="#245e93"/>
          <stop offset="1" stop-color="#1A4872"/>
        </linearGradient>
        <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F59E0B"/>
          <stop offset="1" stop-color="#FDE68A"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="url(#bg)"/>
      <circle cx="1050" cy="120" r="160" fill="#F59E0B" opacity="0.22"/>
      <circle cx="150" cy="650" r="180" fill="#534AB7" opacity="0.28"/>
      <g transform="translate(500,280)">
        <rect width="200" height="200" rx="44" fill="#FFFFFF"/>
        <g transform="translate(48,48) scale(4.4)" fill="none" stroke="#2E74B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM9 5h6v2H9z"/>
        </g>
      </g>
      <g transform="translate(600,560)" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800">
        <text font-size="82" fill="#FFFFFF" letter-spacing="-2">Gachi<tspan fill="url(#amber)">Work</tspan></text>
        <text font-size="22" fill="#EAF2FA" opacity="0.75" y="42" letter-spacing="6">FOR E-9 WORKERS</text>
      </g>
    </svg>
  </template>
  <!-- Desktop stage: iPhone 13 mini framed on a neutral wall -->
  <div id="stage" class="stage">
    <div class="stage-head">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM9 5h6v2H9z"/></svg>
        </div>
        <div>
          <div class="brand-title">Gachi<em>Work</em></div>
          <div class="brand-sub">Interactive Prototype · iPhone 13 mini · responsive</div>
        </div>
      </div>
      <div class="stage-actions">
        <button class="reset-btn" id="resetBtn" title="Back to start">⟲ Reset</button>
        <div class="hint">Toggle Tweaks to change AI display / eval UX / composer layout</div>
      </div>
    </div>

    <!-- Phone device frame. On small viewports the frame dissolves into fullscreen. -->
    <div class="phone-frame" id="phoneFrame">
      <div class="phone-side left"></div>
      <div class="phone-side right"></div>
      <div class="phone-side top"></div>
      <div class="phone-side bottom"></div>
      <div class="phone-notch"></div>
      <div class="phone-screen" id="app">
        <!-- React root -->
      </div>
    </div>

    <div class="stage-footnote">
      Group 18 · KLES Capstone · Pretendard
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- App code -->
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/screens/Chrome.jsx"></script>
  <script type="text/babel" src="src/screens/Auth.jsx"></script>
  <script type="text/babel" src="src/screens/Home.jsx"></script>
  <script type="text/babel" src="src/screens/Composer.jsx"></script>
  <script type="text/babel" src="src/screens/PostDetail.jsx"></script>
  <script type="text/babel" src="src/screens/Board.jsx"></script>
  <script type="text/babel" src="src/screens/Search.jsx"></script>
  <script type="text/babel" src="src/screens/Inbox.jsx"></script>
  <script type="text/babel" src="src/screens/Profile.jsx"></script>
  <script type="text/babel" src="src/screens/RiskAlert.jsx"></script>
  <script type="text/babel" src="src/screens/Expert.jsx"></script>
  <script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
